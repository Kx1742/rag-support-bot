# One-click public demo on Render: https://render.com/docs/blueprint-spec
# In the Render dashboard: New > Blueprint > pick this repository.
services:
  - type: web
    name: bean-and-byte-demo
    runtime: docker
    # The free plan sleeps when idle and has no persistent disk. That's fine for the demo:
    # it reseeds its sample data whenever it starts with an empty database.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "1"
      # Render sits in front of the app as a proxy and serves HTTPS.
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      # Owner login (username "owner"); Render generates a random value you can read in the dashboard.
      - key: STAFF_PASSWORD
        generateValue: true
      # Optional: add a free key from https://aistudio.google.com/apikey for AI answers and chat bookings.
      # Without it the demo runs in offline mode.
      - key: GEMINI_API_KEY
        sync: false
      # Protect the free Gemini quota on a public site.
      - key: DAILY_MESSAGE_LIMIT
        value: "300"
    # For a real business (not the demo), switch to a paid plan, remove DEMO_MODE and keep data on a disk:
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
